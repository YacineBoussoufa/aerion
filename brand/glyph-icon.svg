<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Aerion app icon master (vF2b). Tile + glyph are pure vector; glyph
       geometry measured from the legacy raster mark (brand/icon-legacy.png)
       and composed per the adopted vF2b layout: 198x228 glyph box (15%
       vertical stretch) optically centered on a 256x256 r52 gradient tile.
       NOTE: keep this comment INSIDE the svg element — gdk-pixbuf's format
       sniffer needs "<svg" near the start of the file, and a long comment
       before the tag makes appstream-compose fail with file-read-error. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2742"/>
      <stop offset="1" stop-color="#1D192B"/>
    </linearGradient>
    <!-- gradient spans the full glyph-box canvas (src 0..256), matching the
         raster master where the ramp covered the whole 198x228 box and the
         artwork sampled only its middle -->
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="256">
      <stop offset="0" stop-color="#B18CFF"/>
      <stop offset="1" stop-color="#7B39ED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#tile)"/>

  <g filter="url(#shadow)">
    <!-- glyph box: 256-canvas source coords scaled to 198x228; y offset is
         12.5 (not the geometric 16) matching the raster master, whose
         shadow-merge canvas shifted the glyph up before centering -->
    <g transform="translate(27,12.5) scale(0.7734375,0.890625)">
      <!-- envelope body (centerline rect, stroke 21) -->
      <rect x="85.5" y="68.4" width="160" height="116.8" rx="9.5" fill="none"
            stroke="url(#glyph)" stroke-width="21"/>
      <!-- flap chevron: thinner stroke than the body (17), arms merging into
           the corner elbows; it does NOT touch the top stroke — a dark notch
           separates them -->
      <path d="M 93 86.5 L 165.5 123 L 238 86.5" fill="none" stroke="url(#glyph)"
            stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- speed bars (short, medium, long): round LEFT cap, near-flat RIGHT
           end (r=3), matching the source mark -->
      <path fill="url(#glyph)" d="M 32.1 74.7 L 50 74.7 A 3 3 0 0 1 53 77.7 L 53 91.9 A 3 3 0 0 1 50 94.9 L 32.1 94.9 A 10.1 10.1 0 0 1 32.1 74.7 Z"/>
      <path fill="url(#glyph)" d="M 21.7 117.3 L 50 117.3 A 3 3 0 0 1 53 120.3 L 53 134.5 A 3 3 0 0 1 50 137.5 L 21.7 137.5 A 10.1 10.1 0 0 1 21.7 117.3 Z"/>
      <path fill="url(#glyph)" d="M 10.1 160 L 50 160 A 3 3 0 0 1 53 163 L 53 177.2 A 3 3 0 0 1 50 180.2 L 10.1 180.2 A 10.1 10.1 0 0 1 10.1 160 Z"/>
    </g>
  </g>
</svg>
